# STORY-0.2: Docker Compose — Keycloak 26.5.2 + Postgres
# DAIS / identity-platform local development

services:
  postgres:
    image: postgres:16-alpine
    container_name: identity-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak} -d ${POSTGRES_DB:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - identity-platform-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: identity-platform-keycloak
    restart: unless-stopped
    command:
      - start
      - "--features=organization"
      - "--health-enabled=true"
      - "--metrics-enabled=false"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:?Set KC_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Set KC_ADMIN_PASSWORD in .env}
    ports:
      - "${KC_HTTP_PORT:-8080}:8080"
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
    # Health: http://localhost:9000/health/ready. If image has no curl, remove this block.
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:9000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - identity-platform-net

volumes:
  postgres_data:

networks:
  identity-platform-net:
    driver: bridge
